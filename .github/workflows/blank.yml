
name: Build KujaoNetflix APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Locate Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"

      - name: Accept SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install SDK Packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Extract Project ZIP
        run: |
          mkdir -p extracted

          ZIP=$(find . -maxdepth 2 -type f -iname "*.zip" \
            -not -path "./.git/*" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "Project ZIP not found!"
            exit 1
          fi

          unzip -q "$ZIP" -d extracted
          echo "Extracted: $ZIP"

      - name: Detect Project Directory
        run: |
          SETTINGS=$(find extracted -type f \
            -name "settings.gradle.kts" | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "Gradle project not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project: $PROJECT_DIR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK not generated!"
            exit 1
          fi

          echo "APK: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KujaoNetflix-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
